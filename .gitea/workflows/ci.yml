# Mirrored from .github/workflows/ on 2026-08-27; GH-Actions-syntax compatible with Gitea/Forgejo Actions.
# Not yet run on an actual Gitea/Forgejo runner — verify marketplace-action availability before relying on it.
# See GitHub issue for the tracked follow-up.
name: CI

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this?"
        required: false
        default: "Manual trigger"
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Static Analysis and Quality Checks
  quality-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The upstream uv setup action is not mirrored on gitea.com or
      # code.forgejo.org (404 on both); install uv with the vendor script.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

      - name: Complexity Check (McCabe)
        run: uv run ruff check . --fix

      - name: Security Scan
        # Continue on error since vulnerabilities might be present; goal is visibility first
        continue-on-error: true
        run: uv run pip-audit

      - name: Type Check
        # Continue on error to allow gradual adoption
        continue-on-error: true
        run: uv run mypy .

  # Job 2: End-to-End Test Suite Execution
  test-e2e:
    needs: quality-checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}

      # The upstream uv setup action is not mirrored on gitea.com or
      # code.forgejo.org (404 on both); install uv with the vendor script.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run E2E Tests
        run: uv run pytest -m "e2e"

  # Job 3: Integration Test Suite Execution
  test-integration:
    needs: quality-checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}

      # The upstream uv setup action is not mirrored on gitea.com or
      # code.forgejo.org (404 on both); install uv with the vendor script.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run Integration Tests
        run: uv run pytest -m "integration"

  # Job 4: Fast Unit Test Suite Execution
  test-fast-unit:
    needs: quality-checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}

      # The upstream uv setup action is not mirrored on gitea.com or
      # code.forgejo.org (404 on both); install uv with the vendor script.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Test Fast Unit with Coverage
        run: uv run pytest -m "unit and fast" --cov=logic/src --cov-report=xml --cov-report=term-missing

      # The upstream Codecov upload action is not mirrored on gitea.com or
      # code.forgejo.org; keep the coverage report as a workflow artifact.
      - name: Upload coverage artifact
        uses: https://gitea.com/actions/upload-artifact@v3
        with:
          name: coverage
          path: ./coverage.xml
          if-no-files-found: warn

  # Job 5: Slow Unit Test Suite Execution
  test-slow-unit:
    needs: quality-checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}

      # The upstream uv setup action is not mirrored on gitea.com or
      # code.forgejo.org (404 on both); install uv with the vendor script.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups

      - name: Run Slow Unit Tests
        run: uv run pytest -m "unit and slow"
