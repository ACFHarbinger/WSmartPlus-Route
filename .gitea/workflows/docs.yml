# Mirrored from .github/workflows/ on 2026-08-27; GH-Actions-syntax compatible with Gitea/Forgejo Actions.
# Not yet run on an actual Gitea/Forgejo runner — verify marketplace-action availability before relying on it.
# See GitHub issue for the tracked follow-up.
name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this?"
        required: false
        default: "Manual trigger"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv sync --all-packages --all-extras --all-groups

      - name: Build docs
        run: |
          cd logic/docs
          uv run make html

      # The upstream gh-pages deploy action is not mirrored on gitea.com or
      # code.forgejo.org, and a mirror runner cannot publish to GitHub Pages;
      # keep the built documentation as a workflow artifact instead.
      - name: Upload documentation artifact
        uses: https://gitea.com/actions/upload-artifact@v3
        with:
          name: docs-html
          path: ./logic/docs/build/html
