name: Sync to Public Repo
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this?"
        required: false
        default: "Manual trigger"
  push:
    branches:
      - main
jobs:
  sync:
    if: github.repository == 'ACFHarbinger/WSmart-Route'
    runs-on: ubuntu-latest
    steps:
      # Use the checkout action with your Personal Access Token (PAT)
      # to ensure the local environment has cross-repo permissions
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          fetch-depth: 0 # Essential to get full history for a successful push
          persist-credentials: false

      - name: Push to Public
        env:
          PAT_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          # 1. Configure Git identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Clean up extraheader if set by checkout action to avoid authentication conflicts
          git config --local --unset-all http.https://github.com/.extraheader || true

          # 3. Remove private directories from the whole history, not just the tip.
          # git filter-repo is deterministic, so unchanged input gives the same SHAs
          # and repeated force pushes do not diverge. The callback also drops the
          # assets/ submodule entries (paper repos, Overleaf URL) from every .gitmodules.
          pipx install git-filter-repo==2.47.0
          git filter-repo --force --invert-paths \
            --path bibliography --path assets --path .agent \
            --file-info-callback '
          if filename != b".gitmodules":
              return (filename, mode, blob_id)
          contents = value.get_contents_by_identifier(blob_id)
          kept, skip = [], False
          for line in contents.splitlines(keepends=True):
              if line.strip().startswith(b"[submodule"):
                  skip = b"\"assets/" in line
              if not skip:
                  kept.append(line)
          new = b"".join(kept)
          if new == contents:
              return (filename, mode, blob_id)
          return (filename, mode, value.insert_file_with_contents(new))
          '

          # 4. Add the public remote (filter-repo already removed origin)
          git remote remove public || true
          git remote add public https://x-access-token:${PAT_TOKEN}@github.com/ACFHarbinger/WSmartPlus-Route.git

          # 5. Force push the rewritten history (no bibliography, assets or .agent in any commit)
          git push public main --force
