[project]
name = "wsmart-route-workspace"
version = "1.0.0"
description = "Root workspace manifest for WSmart-Route. The actual Python module lives in logic/ (see logic/pyproject.toml)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.uv.workspace]
members = ["logic"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
explicit_package_bases = true
allow_redefinition = true

files = ["logic/src"]
exclude = [
    "logic/test",
    "logic/docs",
    "logic/benchmark",
    "notebooks",
    "logic/src/pipeline/simulations/wsmart_bin_analysis/test",
    "logic/src/pipeline/simulations/wsmart_bin_analysis/python",
]

[tool.pyrefly]
# Core settings
engine = "pylance"          # pyrefly usually wraps a core engine; pylance/pyright is standard
ai_assisted = true          # Enables the "agentic" suggestions seen in your Antigravity view
venvPath = "."              # The directory containing the venv
venv = ".venv"              # The name of the venv folder
type_checking_mode = "basic"
include = ["logic"]

# Ignore rules (Migration of your pyright/pylance ignores)
ignore = ["**/__init__.py"]

[tool.pyrefly.errors]
"implicit-import" = false
"untyped-import" = false
#"optional-call" = false
#"optional-iterable" = false
#"attribute-access-issue" = false
#"general-type-issues" = false
#"operator-issue" = false
#"argument-type" = false
#"call-issue" = false

# Enable semantic features that were missing in your greyed-out view
#indexing = true
#diagnostic_mode = "workspace"

# =================================================================
# RUFF CONFIGURATION (from ruff.toml)
# =================================================================
[tool.ruff]
src = ["logic/src"]
line-length = 120
target-version = "py310"
exclude = [
    "notebooks/",
    "logic/docs/*.md",
    "logic/src/pipeline/simulations/wsmart_bin_analysis/notebooks",
    "logic/src/pipeline/simulations/wsmart_bin_analysis/export/notebooks",
    "assets/",
    "archive/",
]
extend-exclude = [
    "logic/src/pipeline/simulations/wsmart_bin_analysis/notebooks",
    "logic/src/pipeline/simulations/wsmart_bin_analysis/export/notebooks",
]
force-exclude = true


[tool.ruff.lint]
# Ignore E501 (line length) for notebooks specifically if they are messy
ignore = ["E501", "E741", "SIM118"]
select = ["B", "C90", "E", "F", "I", "W", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Ignore F401 (unused import) for __init__.py files
"__init__.py" = ["F401"]



# =================================================================
# PYTEST CONFIGURATION (from pytest.ini)
# =================================================================

[tool.pytest.ini_options]
pythonpath = "."
# Test discovery
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Test"]
python_functions = ["test_*", "*_test"]
testpaths = ["logic/test"]

# Console output options (addopts converted to list format)
addopts = [
    "-v",                      # Verbose output
    "-ra",                     # Show summary of all test outcomes
    "--showlocals",            # Show local variables in tracebacks
    "--tb=short",              # Shorter traceback format
    "--color=yes",             # Color output
    "--show-capture=all",      # Show captured output on failure
    #"--disable-warnings",      # Disable warnings to reduce noise
    "--import-mode=importlib", # Resolve conftest conflicts
]

# Markers for categorizing tests (converted to key=value pairs)
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "fast: marks tests as fast running",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end",
    "validation: marks tests that validate argument combinations",
    "edge_case: marks tests for edge cases",
    "parametrize: marks parametrized tests",
    "train: marks tests related to training command",
    "mrl_train: marks tests related to meta-reinforcement learning training",
    "hp_optim: marks tests related to hyperparameter optimization",
    "eval: marks tests related to evaluation command",
    "test_sim: marks tests related to simulator test command",
    "gen_data: marks tests related to data generation command",
    "file_system: marks tests related to file system operations",
    "test_suite: marks tests related to test suite command",
    "arg_parser: marks tests for argument parser functionality",
    "model: marks tests for model functionality",
    "data: marks tests for data processing",
    "skip: skip this test",
    "skipif: skip this test if condition is true",
    "xfail: expected to fail",
    "property: marks property-based tests using hypothesis",
]

# Filter warnings (converted to list)
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning",
    "ignore::FutureWarning",
    "ignore:.*urllib3.*:UserWarning",
    "ignore:.*distutils.*:DeprecationWarning",
    "error::ResourceWarning",
]

# Logging configuration
log_level = "INFO"
log_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# JUnit XML output
junit_suite_name = "wsmart_route"
junit_logging = "all"
junit_duration_report = "call"

# Custom configuration (from [pytest] section in .ini)
wsr_test_mode = true
wsr_temp_dir = "./temp_test"


# =================================================================
# COVERAGE CONFIGURATION (from [tool:coverage] and [coverage:*])
# =================================================================
[tool.coverage.run]
source = ["logic/src"]
omit = [
    "logic/src/pipeline/simulations/wsmart_bin_analysis/python",
    "*/benchmark/*",
    "*/test/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.*/*",
    "setup.py",
    "conftest.py",
]
branch = true
data_file = ".coverage"

[tool.coverage.report]
fail_under = 45
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstract",
    "logger\\.",
    "log\\.",
    "pass",
    "from typing import",
    "import typing",
]

[tool.coverage.html]
directory = "htmlcov"
title = "wsmart_route Test Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
