# Policy Configuration

# =============================================================================
# CVRP (Capacitated Vehicle Routing Problem) Solver Configuration
# =============================================================================
# PURPOSE:
#   Static baseline: visit exactly the selected (mandatory) bins with a
#   capacitated fleet and minimise distance. No profit-driven optional visits.
#   With the default regular selection below, every bin is collected on a
#   fixed schedule (every 3, 4 or 5 days).
#
# ALGORITHM (engine: ortools):
#   1. First solution: PATH_CHEAPEST_ARC
#   2. Improve with Guided Local Search until time_limit
#
# ENGINES:
#   ortools        OR-Tools routing solver (default)
#   pyvrp          PyVRP hybrid genetic search
#   clarke_wright  Clarke-Wright savings, no time limit
#   All three use fill levels (% of one bin) as demands and the simulator's
#   0.1 km integer distance matrix.
#
# =============================================================================

cvrp:
  ortools:
    # ---------------------------------------------------------------------
    # Solver Backend
    # ---------------------------------------------------------------------
    - engine: "ortools"
      # Execution backend: Google OR-Tools VRP solver
      # Options: "ortools" (OR-Tools GLS), "pyvrp" (PyVRP HGS), "clarke_wright" (savings)

    - n_vehicles: 0
      # Use unlimited/dynamic number of vehicles by default
      # so that mandatory_selection strategies don't fail due to 1-vehicle capacity limit.

    # ---------------------------------------------------------------------
    # Performance Tuning
    # ---------------------------------------------------------------------
    - cache: false
      # Enable/disable distance matrix caching
      # true = faster repeated solves, higher memory usage
      # false = recalculate each time, lower memory footprint
      # Recommendation: false for one-off solves, true for batch experiments

    # VRPP Settings
    - vrpp: true

    # ---------------------------------------------------------------------
    # Node Selection Strategy
    # ---------------------------------------------------------------------
    - mandatory_selection: {"other/ms_regular.yaml": ["regular_lvl3", "regular_lvl4", "regular_lvl5"]}
    # Multiple selection strategies for waste collection
    # Collects bins when fill level exceeds 70%, 80%, or 90%
    # Note: Uses regular thresholds instead of lookahead prediction
    # See: docs/MUST_GO_STRATEGIES.md for strategy comparison
    # ---------------------------------------------------------------------
    # Runtime Control
    # ---------------------------------------------------------------------
    - time_limit: 60
      # Maximum wall-clock seconds for optimization
      # Range: 5-300 (5s = real-time, 60s = production, 300s = thorough)
      # OR-Tools will return best solution found within time budget

    # ---------------------------------------------------------------------
    # Infrastructure Settings
    # ---------------------------------------------------------------------
    - route_improvement: []
      # Route refinement heuristics (OR-Tools local search handles this)
      # Empty = trust OR-Tools built-in 2-opt/relocate
      # OR-Tools already applies: 2-opt, Relocate, Exchange, CROSS

    # ---------------------------------------------------------------------
    # Solver code
    # ---------------------------------------------------------------------
    # logic/src/policies/route_construction/other_algorithms/
    #   capacitated_vehicle_routing_problem/cvrp.py
# =============================================================================
