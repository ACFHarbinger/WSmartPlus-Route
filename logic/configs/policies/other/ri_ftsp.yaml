# =============================================================================
# route improvement: Fast TSP
# =============================================================================
# PURPOSE:
#   Re-sequence each depot-to-depot trip with the fast-tsp library.
#   The set of bins in each trip is unchanged; only the order changes.
#
# ALGORITHM:
#   For each trip: fast-tsp's find_tour on the trip's (depot + bins) matrix.
#   Up to 20 bins it is exact (Held-Karp dynamic programming, repeatable);
#   above that it is a time-budgeted local search (time_limit per trip),
#   which is not repeatable run to run (the library has no seed).
#   If the library fails, the trip is kept in its input order.
#
# USE CASES:
#   - Refine neural policy outputs (AM, TAM often produce suboptimal sequences)
#   - Quick polish after constructive heuristics
#   - Default route improvement for most policies
#
# PERFORMANCE:
#   - Very fast: <0.1s per route for 50 nodes
#   - Improvement: Typically 2-5% cost reduction
#
# PARAMETERS:
#   - methods: [fast_tsp] - Single-method route improvement pipeline
# =============================================================================

ftsp:
  methods:
    - "fast_tsp"

  # Fast TSP parameters
  time_limit: 30.0
