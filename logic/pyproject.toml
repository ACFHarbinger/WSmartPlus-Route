[project]
name = "wsmart-route"
version = "1.0.0"
description = "Machine Learning Models and Operations Research Solvers for Combinatorial Optimization Tasks"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.1.4",
    "scipy>=1.13.1",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "torchrl==0.13.3",
    "tensordict==0.13.0",
    "torch-geometric>=2.3.1",
    "torch-scatter>=2.1.2",
    "pytorch-lightning>=2.0.0",
    "hydra-core>=1.3.0",
    "hydra-colorlog>=1.2.0",
    "omegaconf>=2.3.0",
    "loguru>=0.7.3",
    "rich>=14.1.0",
    "tqdm>=4.67.1",
    "networkx>=3.2.1",
    "einops>=0.8.0",
    "scikit-learn>=1.6.1",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
    "joblib>=1.5.1",
    "cryptography>=45.0.6",
    "requests>=2.32.5",
    "wandb>=0.16.0",
    "openpyxl>=3.1.5",
    "torch-sparse>=0.6.18",
    "ml-dtypes>=0.4.1",
    "protobuf==7.35.1",
    "python-pptx>=1.0.2",
    "docxtpl>=0.20.2",
    "latex2mathml>=3.81.0",
]

# Corrected 'dev' dependencies
[dependency-groups]
dev = [
    "black>=25.9.0",
    "expecttest>=0.3.0",
    "git-filter-repo>=2.47.0",
    "mypy>=1.18.2",
    "mypy-protobuf>=5.0.0",
    "pyinstaller>=6.16.0",
    "pyinstaller-hooks-contrib>=2026.0",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "hypothesis>=6.141.1",
    "ruff>=0.14.3",
    "pip-audit>=2.7.3",
    "pytest-cov>=6.0.0",
    "pre-commit>=3.5.0",
    "tabulate>=0.9.0",
    "types-pyyaml>=6.0.12.20250915",
    "mutmut>=2.5.0",
    "rich>=14.1.0",
    "pip>=26.0.1",
    "pyrefly>=0.61.0",
    "pylint>=3.3.9",
]

[project.optional-dependencies]
gpu = [
    "triton>=2.2.0 ; sys_platform != 'win32'",
    "torch-tb-profiler>=0.4.3",
    "nvidia-ml-py>=13.580.65",
    "gymnasium>=1.1.1",
    "onnx>=1.19.0",
    "onnxsim>=0.6.2 ; python_version >= '3.10'",
]
geo = [
    "osmnx>=2.0.6",
    "pyproj>=3.6.1",
    "shapely>=2.0.7",
    "geopandas>=1.0.1",
    "geopy>=2.4.1",
    "googlemaps>=4.10.0",
    "openrouteservice>=2.3.3",
]
solvers = [
    "gurobipy>=11.0.3",
    "hexaly>=14.0.20251008",
    "ortools>=9.4.1874",
    "pyvrp>=0.9.1",
    "vrpy>=0.5.1",
    "alns>=7.0.0",
    "fast-tsp>=0.1.4",
    "pyomo>=6.9.5",
]
viz = [
    "matplotlib>=3.9.4",
    "seaborn>=0.13.2",
    "plotly>=6.3.0",
]
hpo = [
    "optuna>=4.5.0",
    "optuna-integration[pytorch-lightning]>=4.7.0",
    "dehb>=0.1.2",
]
tracking = [
    "mlflow>=2.10.0",
    "zenml[server]>=0.60.0",
    "ray[tune]>=2.30.0",
    "pyarrow>=16.1.0",
    "opentelemetry-proto>=1.15.0,<=1.44.0",
    "sqlalchemy-utils>=0.41.0",
    "litlogger>=0.1.0",
    "sqlmodel>=0.0.14",
    "sqlalchemy>=2.0.0",
]
analysis = [
    "statsmodels>=0.14.6",
    "plotext>=5.3.2",
    "loss-landscapes>=3.0.6",
    "pyvis>=0.3.2",
]
docs = [
    "myst-nb>=1.3.0",
    "sphinx>=7.4.7",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-book-theme>=1.1.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-hoverxref>=1.4.2",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-uml>=0.4.0",
    "sphinxcontrib-mermaid>=1.2.3",
]
web = [
    "jinja2>=3.1.6",
]

# Note: project.optional-dependencies.docs is for users building docs.
# The 'docs' below is redundant or can be removed if moved to project.optional-dependencies.

# Optional dependencies are now in [project.optional-dependencies]

[tool.uv.sources]
hexaly = { index = "hexaly_package" }
torch_scatter = { index = "pyg" }
torch_sparse = { index = "pyg" }

[[tool.uv.index]]
name = "hexaly_package"
url = "https://pip.hexaly.com"

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.12.1+cu130.html"
format = "flat"
